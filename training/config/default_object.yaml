defaults:
  - default_dataset

# torchrun --master_port=29600 --nproc_per_node=1 launch.py  --config default_object

exp_name: test_0223_object_small_dataset
img_size: 518
num_workers: 8
seed_value: 42
accum_steps: 1    # We did not use gradient accumulation in our training, while if you suffer from OOM, you can try to use it.
patch_size: 14
val_epoch_freq: 5
max_img_per_gpu: 24

limit_train_batches: 10000
limit_val_batches: 1

debug:
  force_model_output_to_ground_truth: False

data:
  # The code for data still looks too complicated. I should refactor this again (do I have time?...)
  train:
    _target_: data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu}
    common_config:
      img_size: ${img_size}
      patch_size: ${patch_size}
      debug: False
      map_xyz_bfloat16: True
      repeat_batch: False
      img_nums: [4, 6]
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: data.datasets.6dpose.SixDPoseDataset
          split: train
          AUTOMATIC_DATASET_DIR: /mnt/train-data-4-hdd/yian/6dpose_obj/automatic_dataset
          only_run_name: run_0000
  val:
    _target_: data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu}
    common_config:
      img_size: ${img_size}
      patch_size: ${patch_size}
      debug: False
      map_xyz_bfloat16: True
      img_nums: [4, 6]
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: data.datasets.6dpose.SixDPoseDataset
          split: train
          AUTOMATIC_DATASET_DIR: /mnt/train-data-4-hdd/yian/6dpose_obj/automatic_dataset
          only_run_name: run_0000


logging:
  log_dir: logs/${exp_name}
  log_visuals: False
  log_freq: 1
  log_level_primary: DEBUG
  log_level_secondary: WARNING
  all_ranks: False
  tensorboard_writer:
    _target_: train_utils.tb_writer.TensorBoardLogger
    path: ${logging.log_dir}/tensorboard
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss_objective
        - loss_conf_object_point
        - loss_reg_object_point
        - loss_grad_object_point
        - loss_object_srt
        - loss_object_pose
        - loss_object_scale
        - loss_object_translation
        - loss_object_pose_init
    val:
      keys_to_log:
        - loss_objective
        - loss_conf_object_point
        - loss_reg_object_point
        - loss_grad_object_point
        - loss_object_srt
        - loss_object_pose
        - loss_object_scale
        - loss_object_translation
        - loss_object_pose_init



checkpoint:
  save_dir: logs/${exp_name}/ckpts
  save_freq: 5
  resume_checkpoint_path: /mnt/train-data-4-hdd/yian/vggt_old/model/model.pt
  strict: False


loss:
  _target_: loss.MultitaskLoss
  camera: null
  depth: null
  point: null
  track: null
  object_point:
    weight: 1.0
    gamma: 1.0
    alpha: 0.2
    gradient_loss_fn: "normal"
    valid_range: -1
  # object_srt:
  #   weight: 1.0
  #   loss_type: "l1"
  #   weight_pose: 5.0
  #   weight_scale: 1.0
  #   weight_translation: 1.0
  #   init_w: 1.0




optim:
  param_group_modifiers: False
  train_object_token_only: False

  optimizer:
    _target_: torch.optim.AdamW
    lr: 1e-4
    weight_decay: 0.05

  frozen_module_names:
      - "*aggregator*"

  amp:
    enabled: True
    amp_dtype: bfloat16
  gradient_clip:
    _target_: train_utils.gradient_clip.GradientClipper
    configs:
      # - module_name: ["shared_object_latent"]
      #   max_norm: 1.0
      #   norm_type: 2
      - module_name: ["aggregator"]
        max_norm: 1.0   # feel free to reduce this if you see instabilities
        norm_type: 2
      - module_name: ["object_pt_head"]
        max_norm: 1.0   # feel free to reduce this if you see instabilities
        norm_type: 2
      # - module_name: ["object_srt_head"]
      #   max_norm: 1.0   # feel free to reduce this if you see instabilities
      #   norm_type: 2
  options:
    lr:
      - scheduler:
          _target_: fvcore.common.param_scheduler.CompositeParamScheduler
          schedulers:
            - _target_: fvcore.common.param_scheduler.LinearParamScheduler
              start_value: 1e-8
              end_value: 1e-4
            - _target_: fvcore.common.param_scheduler.CosineParamScheduler
              start_value: 1e-4
              end_value: 1e-8
          lengths: [0.05, 0.95]
          interval_scaling: ['rescaled', 'rescaled']
    weight_decay:
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 0.05




max_epochs: 20

model:
  _target_: vggt.models.vggt.VGGT
  enable_camera: False
  enable_depth: False
  enable_point: False
  enable_track: False
  enable_object_point: True
  enable_object_srt: False
  use_shared_object_latent: False # set False to switch back to the original version (no shared latent)


distributed:
  # check https://docs.pytorch.org/docs/stable/generated/torch.nn.parallel.DistributedDataParallel.html for options
  backend: nccl
  comms_dtype: None
  find_unused_parameters: False
  timeout_mins: 30
  gradient_as_bucket_view: True  # Less memory used
  bucket_cap_mb: 25
  broadcast_buffers: True

cuda:
    cudnn_deterministic: False
    cudnn_benchmark: False
    allow_tf32: True
