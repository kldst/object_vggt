# Dataset override fragment for category generalization training.
# Train split policy:
#   single/train object ids == multi/train target object ids.
- _target_: data.datasets.ov9d_single_pose_normalize.OV9DSinglePoseNormalizeDataset
  split: train
  DATA_ROOT: /mnt/train-data-4-hdd/yian/freepose/ov9d/ov9d
  SPLIT_JSON: /mnt/train-data-4-hdd/yian/freepose/omni-object_clone/splits_ov9d_unseen_category_generalization/single/train.json
  len_train: 7000
  num_scene_views: 4
  num_object_views: 4
  min_view_gap: 5
  object_view_min_gap: 6
  object_view_max_gap: 9
  load_point_map: false
  scale_by_points: true
  negative_object_prob: 0.3
- _target_: data.datasets.ov9d_multi_pose_normalize.OV9DMultiPoseNormalizeDataset
  split: train
  DATA_ROOT: /mnt/train-data-4-hdd/yian/freepose/ov9d/ov9d
  SPLIT_JSON: /mnt/train-data-4-hdd/yian/freepose/omni-object_clone/splits_ov9d_unseen_category_generalization/multi/train.json
  len_train: 7000
  num_scene_views: 4
  num_object_views: 4
  fixed_object_view_ids: [1, 5, 10, 15]
  min_view_gap: 5
  object_view_min_gap: 6
  object_view_max_gap: 9
  load_point_map: false
  scale_by_points: true
  negative_object_prob: 0.3
